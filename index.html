<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Bitácora de Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F1F2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column app (max 560px), sticky header, fixed bottom tabs; competition-plate colors code each training day */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --surface-2:#E7E9ED; --ink:#14171C; --muted:#5D6570; --line:#D6DAE0;
  --gold:#9A6F00; --gold-bg:#FBF0CF; --ok:#1F7A43; --danger:#B42318;
  --p-red:#D0342C; --p-blue:#2A5FC4; --p-yellow:#D9A400; --p-green:#2C9A55; --p-grey:#7D8794;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1114; --surface:#181B20; --surface-2:#23272E; --ink:#ECEEF1; --muted:#9AA3AF; --line:#2D3239;
  --gold:#E8BC4A; --gold-bg:#3A3014; --ok:#4CC27A; --danger:#F07167;
  --p-red:#E5544B; --p-blue:#5B8BEA; --p-yellow:#E8B92A; --p-green:#45B86F; --p-grey:#8F99A6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#181B20; --surface-2:#23272E; --ink:#ECEEF1; --muted:#9AA3AF; --line:#2D3239;
  --gold:#E8BC4A; --gold-bg:#3A3014; --ok:#4CC27A; --danger:#F07167;
  --p-red:#E5544B; --p-blue:#5B8BEA; --p-yellow:#E8B92A; --p-green:#45B86F; --p-grey:#8F99A6; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p-blue);outline-offset:2px}
.num,input,.tab-n{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.plates{display:flex;gap:3px}
.plates i{width:6px;height:18px;border-radius:2px;display:block}
.logo{width:28px;height:28px;border-radius:7px;display:block;flex:none}
.top-meta{font-size:13px;color:var(--muted)}
main{max-width:560px;margin:0 auto;padding:16px 16px 150px;display:flex;flex-direction:column;gap:16px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke-width:2.4}

h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:20px;font-weight:600}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.day-card{position:relative;overflow:hidden;padding-left:22px}
.day-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--plate)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--plate);flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.ex-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ex-list li{display:flex;justify-content:space-between;gap:10px;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ex-list li:last-child{border-bottom:0;padding-bottom:0}
.ex-list .t{font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap;color:var(--muted)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wd b{width:100%;aspect-ratio:1;max-width:44px;border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:17px;color:var(--muted)}
.wd.done b{background:var(--plate);border:0;color:#fff}
.wd.today b{border-style:solid;border-color:var(--ink);color:var(--ink)}
.wd.done.today b{outline:2px solid var(--ink);outline-offset:2px}

.other{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.other button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-height:52px}
.other button span{display:flex;flex-direction:column;line-height:1.2}
.other small{color:var(--muted);font-size:12px}

/* Session */
.sess-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);z-index:4;background:var(--bg);padding:8px 0;margin:-8px 0 0;border-bottom:1px solid var(--line)}
.clock{font-family:var(--f-display);font-size:26px;font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex .meta{font-size:14px;color:var(--muted)}
.useg button{padding:4px 9px;font-size:13px}
.uu{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hint{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);align-self:flex-start}
.hint.up{background:var(--gold-bg);color:var(--gold)}
.sets{display:grid;gap:6px}
.set,.set-h{display:grid;grid-template-columns:28px minmax(0,1fr) 76px 64px 46px;gap:8px;align-items:center}
.set-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.set-h span:nth-child(n+3){text-align:center}
.sn{font-family:var(--f-display);font-size:19px;font-weight:600;text-align:center;color:var(--muted)}
.prev{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{width:100%;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font-size:18px;font-weight:600;padding:0 4px}
.set input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.chk{height:44px;border-radius:8px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center}
.chk svg{width:20px;height:20px;stroke:var(--muted)}
.set.done input{background:transparent;border-color:transparent}
.set.done .chk{background:var(--ok);border-color:var(--ok)}
.set.done .chk svg{stroke:#fff}
.set.pr .sn{color:var(--gold)}
.set-actions{display:flex;gap:8px;justify-content:space-between}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{height:46px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:17px;color:var(--ink);width:100%}
.field textarea{height:auto;min-height:70px;padding:10px 12px;font-size:15px;font-family:inherit}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.restbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:6;padding:0 16px 8px}
.restbar-in{max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative;overflow:hidden}
.restbar-in .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--p-yellow);transition:width .25s linear}
.restbar .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.restbar .tm{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;margin-right:auto}
.restbar button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;font-weight:600;min-height:38px;opacity:.9}

/* Progress */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.big small{font-size:18px;font-weight:600;color:var(--muted);margin-left:4px}
.delta{font-weight:600;font-size:14px}
.delta.pos{color:var(--ok)} .delta.neg{color:var(--danger)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}

/* Records */
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec h3{font-size:18px}
.rec .v{font-family:var(--f-display);font-size:24px;font-weight:700;text-align:right;line-height:1}
.rec .s{font-size:13px;color:var(--muted)}
.new{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--gold-bg);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}

/* History */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hist>button{all:unset;box-sizing:border-box;width:100%;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer}
.hist .stats{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.hist .body{padding:0 16px 14px;display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.hist .body .l{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.hist .body .l span:last-child{color:var(--muted);text-align:right}

/* Routine editor */
.ed-row{display:grid;grid-template-columns:minmax(0,1fr) 56px 56px 56px;gap:6px;align-items:end}
.ed-row .field input{height:40px;font-size:15px;padding:0 8px}
.ed-ops{display:flex;gap:6px;grid-column:1/-1;justify-content:flex-end}
.ed-item{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:16px;height:16px}

.banner{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:12px 14px;font-size:14px}
.empty{text-align:center;padding:28px 16px;display:grid;gap:8px;justify-items:center}
.empty .logo{width:56px;height:56px;border-radius:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.gold{background:var(--gold);color:#fff}
.modal{position:fixed;inset:0;z-index:10;background:rgba(10,12,15,.55);display:grid;place-items:end center;padding:16px}
.modal-in{background:var(--surface);border-radius:14px;padding:20px;width:100%;max-width:480px;display:grid;gap:14px;margin-bottom:env(safe-area-inset-bottom,0px)}
.modal-in .row{justify-content:flex-end}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sumgrid div{display:grid;gap:2px}
.sumgrid b{font-family:var(--f-display);font-size:28px;line-height:1}
.sumgrid span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.set,.set-h{grid-template-columns:24px minmax(0,1fr) 66px 56px 44px;gap:6px}}

/* v4: set types, RPE, plates, analysis */
button.sn{border:0;background:transparent;padding:0;height:44px;border-radius:8px;width:100%}
button.sn:hover{background:var(--surface-2)}
.set.t-w .sn{color:var(--p-blue)} .set.t-f .sn{color:var(--danger)} .set.t-d .sn{color:var(--gold)}
.set-actions{flex-wrap:wrap}
.set.t-w input{font-weight:500}
.set.pr .sn{color:var(--gold)}
.rpe{width:100%;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;padding:0 4px;color:var(--ink)}
.ex-tools{display:flex;gap:6px;flex-wrap:wrap}
.legend{font-size:13px;color:var(--muted);margin:0}
.legend b{font-family:var(--f-display);font-size:15px}
.modal-in{max-height:calc(100vh - 32px);overflow:auto}
.barviz{display:flex;align-items:center;justify-content:center;gap:2px;height:110px;background:var(--surface-2);border-radius:var(--r);padding:8px;overflow:hidden}
.barviz .sleeve{width:20px;height:10px;background:var(--p-grey);border-radius:2px;flex:none}
.barviz .collar{width:8px;height:26px;background:var(--muted);border-radius:2px;flex:none}
.barviz .pl{width:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
.plist{font-family:var(--f-display);font-size:22px;font-weight:600}
.warn{color:var(--danger);font-size:14px;margin:0}
.seg.full{display:grid;grid-auto-columns:1fr;width:100%}
.mrow{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
.mtrack{position:relative;height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.mband{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.14}
.mfill{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--ink)}
.mfill.lo{background:var(--p-grey)} .mfill.ok{background:var(--ok)} .mfill.hi{background:var(--gold)}
.mval{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mval small{display:block;color:var(--muted);font-size:12px}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.navrow .lbl{font-family:var(--f-display);font-weight:600;font-size:19px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{font-size:11px;text-align:center;color:var(--muted);font-weight:600;letter-spacing:.04em}
.cal b{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--muted);background:var(--surface-2)}
.cal b.done{background:var(--plate);color:#fff}
.cal b.today{outline:2px solid var(--ink);outline-offset:1px}
.cal b.out{background:transparent}
.ex-opts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ex-opts .eq{display:flex;align-items:center;gap:4px}
.ex-opts select{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:0 6px;font-size:14px;color:var(--ink);max-width:118px}
.chip.sm{padding:5px 10px;font-size:13px;min-height:34px}
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto}
.pick{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;gap:2px;width:100%}
.pick small{color:var(--muted);font-size:13px}
.pk-q{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:16px;color:var(--ink);width:100%}
details.pk summary,details.howto summary{cursor:pointer;font-weight:600;color:var(--ink)}
.chk-line{display:flex;gap:8px;align-items:center;font-size:15px}
.chk-line input{width:20px;height:20px}
.body-card.due{outline:2px solid var(--p-blue);outline-offset:-2px}
.howto p{margin:6px 0 0}
.cal b[data-act]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.cal b[data-act]:active{transform:scale(.94)}
.daydet{display:flex;flex-direction:column;gap:8px}
.daydet .l{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.daydet .l .num{text-align:right}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--gold-bg);color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpis div{display:grid;gap:2px}
.kpis b{font-family:var(--f-display);font-size:28px;line-height:1}
.kpis>div>span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpis em{font-style:normal;font-size:13px;font-weight:600}
.pos{color:var(--ok)} .neg{color:var(--danger)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ed-row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.ed-row2 select{height:40px!important;font-size:15px!important;padding:0 8px!important}

/* exercise reference images */

<script>

const S = {

  routines: null, settings: { ...DEF_SETTINGS }, sessions: [],
  loaded: { routines: false, sessions: false },
  tab: 'hoy', active: null, progEx: null, metric: 'e1rm', histOpen: null, editDay: null, editDraft: null,

const STYPES = ['n', 'w', 'f', 'd'];
const STYPE_LBL = { w: 'C', f: 'F', d: 'D' };
const STYPE_NAME = { n: 'Normal', w: 'Calentamiento', f: 'Al fallo', d: 'Drop set' };
const BODY_FIELDS = [['weight', 'Peso', 'bw'], ['fat', 'Grasa', '%'], ['waist', 'Cintura', 'cm'], ['hip', 'Cadera', 'cm'], ['chest', 'Pecho', 'cm'], ['shoulders', 'Hombros', 'cm'], ['neck', 'Cuello', 'cm'], ['arm', 'Brazo', 'cm'], ['forearm', 'Antebrazo', 'cm'], ['thigh', 'Muslo', 'cm'], ['calf', 'Pantorrilla', 'cm']];
const EQUIP = [['barra', 'Barra'], ['mancuerna', 'Mancuernas'], ['maquina', 'Máquina'], ['polea', 'Polea'], ['smith', 'Smith'], ['corporal', 'Peso corporal'], ['banda', 'Banda'], ['otro', 'Otro']];
const eqLabel = k => (EQUIP.find(x => x[0] === k) || ['', ''])[1];
const RESTS = [45, 60, 90, 120, 150, 180, 240, 300];
const RPES = [6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10];

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoOf(new Date());
const dateOf = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = (iso, opt) => dateOf(iso).toLocaleDateString('es-EC', opt || { weekday: 'short', day: 'numeric', month: 'short' });
const num = v => { if (v === null || v === undefined || v === '') return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmtN = (v, d = 1) => (Math.round(v * 10 ** d) / 10 ** d).toLocaleString('es-EC', { maximumFractionDigits: d });
const toKg = (w, unit) => unit === 'lb' ? w / 2.20462 : w;
const fromKg = (kg, u) => (u || S.settings.unit) === 'lb' ? kg * 2.20462 : kg;
const U = () => S.settings.unit;
const W = (kg, u) => fmtN(fromKg(kg, u), 1);
const exUnit = id => { const e = exInfo(id); return (e && e.unit) || U(); };
const restFor = id => { const e = exInfo(id); return num(e && e.rest) || num(S.settings.rest) || 90; };
const eu = (en, s) => en.unit || (s && s.unit) || 'kg';
const e1rm = (w, r) => r <= 0 ? 0 : (r === 1 ? w : w * (1 + r / 30));
const dur = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min'; };

const days = () => (S.routines && Array.isArray(S.routines.days)) ? S.routines.days : [];
const dayById = id => days().find(d => d.id === id);

const repTxt = e => e.repMin === e.repMax ? e.repMin : e.repMin + '–' + e.repMax;
const target = e => e.sets + ' × ' + repTxt(e) + (e.perSide ? ' por pierna' : '');

function allExercises() {
  const map = new Map();
  for (const d of days()) for (const e of (d.exercises || [])) if (!map.has(e.id)) map.set(e.id, { ...e, color: d.color });
  for (const e of extras()) if (!map.has(e.id)) map.set(e.id, { ...e, color: (map.get(e.base) || {}).color || 'grey' });

}
const doneSessions = () => S.sessions.filter(s => s.status === 'done').sort((a, b) => a.startedAt - b.startedAt);

/* stats of one exercise in one session (kg) */
const isWork = s => s.t !== 'w';
function entryStats(entry, unit) {
  const sets = (entry.sets || []).filter(s => s.done && num(s.r) > 0 && isWork(s));

    for (const en of (s.entries || [])) if (en.exId === exId) {
      const st = entryStats(en, eu(en, s));
      if (st) out.push({ date: s.date, at: s.startedAt, sid: s.id, sets: en.sets.filter(x => x.done && isWork(x)), unit: eu(en, s), target: en.target, ...st });

}

    if (h.maxW > b.maxW.maxW) b.maxW = h;
    if (h.e1rm > b.e1rm.e1rm) b.e1rm = h;

function lastFor(exId, excludeId) { const h = history(exId, excludeId); return h.length ? h[h.length - 1] : null; }
/* ---------- ENTRENADOR ----------

const roundTo = (v, st) => Math.round(v / st) * st;
const deloadOn = () => !!S.settings.deloadUntil && today() <= S.settings.deloadUntil;
function coach(exId, tgt, u, excludeId) {
  const h = history(exId, excludeId); const last = h[h.length - 1]; if (!last || !tgt) return null;
  const sets = last.sets.filter(s => num(s.r) > 0 && s.t !== 'd'); if (!sets.length) return null;
  const reps = sets.map(s => num(s.r)); const rpes = sets.map(s => num(s.rpe)).filter(x => x);
  const rpe = rpes.length ? rpes.reduce((a, b) => a + b, 0) / rpes.length : null;
  const repMin = tgt.repMin || 1, repMax = tgt.repMax || repMin;
  if (last.maxW <= 0) {   // bodyweight: progress by reps
    const r = Math.min(repMax, Math.min(...reps) + 1);
    return { w: null, reps: r, kind: reps.every(x => x >= repMax) ? 'up' : 'keep', txt: reps.every(x => x >= repMax) ? 'Llegaste al tope: añade peso o pasa a una variante más difícil' : 'Busca ' + r + ' repeticiones en cada serie' };
  }

  const allTop = reps.every(x => x >= repMax);
  if (allTop && (rpe === null || rpe <= 9)) return { w: roundTo(lastW + st, st), reps: repMin, kind: 'up', txt: `Sube a ${fmtN(roundTo(lastW + st, st))} ${u}: hiciste ${repMax}+ en todas las series` };
  if (rpe !== null && rpe <= 7 && Math.min(...reps) >= repMin) return { w: roundTo(lastW + st, st), reps: Math.max(repMin, Math.min(...reps) - 1), kind: 'up', txt: `Sube a ${fmtN(roundTo(lastW + st, st))} ${u}: la última vez te sobraban repeticiones (RPE ${fmtN(rpe)})` };

  const r = Math.min(repMax, Math.max(repMin, Math.min(...reps) + 1));
  return { w: Math.round(lastW * 10) / 10, reps: r, kind: 'keep', txt: `Mantén ${fmtN(lastW)} ${u} y busca ${r} repeticiones` + (rpe !== null && rpe >= 9.5 ? ' (la última fue muy dura: no fuerces el fallo)' : '') };
}
function stallOf(exId) {

function stallTip(exId) {

  return 'Prueba bajar 10 % el peso y subir repeticiones 2 semanas' + (alt ? `, o cambia a la variante con ${eqLabel(alt).toLowerCase()}` : ', o cámbialo por otro ejercicio del mismo músculo') + '.';
}
/* deload: ≥ 5 straight weeks meeting the weekly goal plus signs of fatigue (≥ 3 stalled exercises or average RPE ≥ 9) */
function deloadAdvice() {

}
function coachCard() {
  if (deloadOn()) return `<div class="card"><div class="spread"><span class="eyebrow">Entrenador</span><button class="btn sm ghost" data-act="deloadoff">Terminar descarga</button></div><div class="coach deload"><b>Semana de descarga hasta el ${fmtDate(S.settings.deloadUntil, { weekday: 'long', day: 'numeric' })}</b><span>Usa ~90 % del peso, la mitad de las series y deja 3 o más repeticiones en reserva. Ya viene así en tus sesiones.</span></div></div>`;
  const d = deloadAdvice();
  const st = allExercises().map(e => [e, stallOf(e.id)]).filter(x => x[1]).slice(0, 3);
  if (!d && !st.length) return '';
  return `<div class="card"><span class="eyebrow">Entrenador</span>
    ${d ? `<div class="coach deload"><b>Te toca una semana de descarga</b><span>Llevas ${d.run} semanas seguidas cumpliendo tu meta${d.stalled >= 3 ? ` y ${d.stalled} ejercicios estancados` : ''}${d.rpe ? `; RPE promedio ${fmtN(d.rpe)}` : ''}. Bajar la carga una semana reduce la fatiga y te deja seguir progresando. ${refLink('bell2023')}</span><button class="btn sm primary" data-act="deloadon" style="justify-self:start">Empezar descarga (7 días)</button></div>` : ''}
    ${st.map(([e, s]) => `<div class="coach stall"><b>${esc(e.name)}: estancado</b><span>Tu mejor marca (${W(s.best.e1rm, exUnit(e.id))} ${exUnit(e.id)} de 1RM est.) es de hace ${s.weeks} semanas y ${s.since} sesiones. ${esc(stallTip(e.id))}</span></div>`).join('')}</div>`;
}
const setStr = (s, from, to, full) => { const w = num(s.w) || 0; return (w ? fmtN(fromKg(toKg(w, from), to || from)) + '×' : '') + num(s.r) + (full && s.t && STYPE_LBL[s.t] && s.t !== 'w' ? ' ' + STYPE_LBL[s.t] : '') + (full && num(s.rpe) ? ' @' + fmtN(num(s.rpe)) : ''); };
const workSets = en => (en.sets || []).filter(x => x.done && isWork(x));
const warmCount = en => (en.sets || []).filter(x => x.done && !isWork(x)).length;

/* exercise metadata from the current routine */
function exInfo(id) { for (const d of days()) for (const e of (d.exercises || [])) if (e.id === id) return e; return extras().find(e => e.id === id) || null; }

const baseOf = id => { const e = exInfo(id); return (e && e.base) || id; };

function idForEquip(nr, baseId, eq) {
  const b = findIn(nr, baseId); if (!b) return baseId;
  if (!b.equip) { if (eq) eachDef(nr, baseId, e => { e.equip = eq; }); return baseId; }
  if (!eq || b.equip === eq) return baseId;

  if (!findIn(nr, vid)) { const v = clone(b); delete v.bar; delete v.color; Object.assign(v, { id: vid, name: b.name + ' (' + eqLabel(eq).toLowerCase() + ')', equip: eq, base: baseId }); nr.extra = (nr.extra || []).concat([v]); }

function keepOrphans(nr) {

  for (const d of days()) for (const e of (d.exercises || [])) if (!inDays.has(e.id) && !inExtra.has(e.id) && history(e.id).length) { const c = clone(e); delete c.color; nr.extra = (nr.extra || []).concat([c]); inExtra.add(e.id); }
}
function musclesOf(exId, fallbackGroup) {

  return { main: g, sec: g2 && g2 !== g ? g2 : '' };
}
/* bar & plates */
const barFor = (exId, u) => { const e = exInfo(exId); if (e && e.bar !== undefined && e.bar !== null) return num(e.bar) || 0; const b = S.settings.bar || {}; return num(b[u]) ?? (u === 'lb' ? 45 : 20); };
const platesFor = u => { const p = (S.settings.plates || {})[u]; return (Array.isArray(p) && p.length ? p : PLATES_DEF[u]).slice().sort((a, b) => b - a); };

  if (!(total > 0)) return null;
  if (total < bar - 1e-6) return { under: true };

/* weeks, streaks */
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const weekGoal = () => Math.max(1, num(S.settings.weekGoal) || days().length || 3);
function streaks() {
  const per = new Map(); for (const s of doneSessions()) { const k = isoOf(mondayOf(dateOf(s.date))); per.set(k, (per.get(k) || 0) + 1); }
  const goal = weekGoal(); const cur = mondayOf(new Date());
  let w = cur, n = 0; if ((per.get(isoOf(w)) || 0) < goal) w = addDays(w, -7);
  while ((per.get(isoOf(w)) || 0) >= goal) { n++; w = addDays(w, -7); }

const BK = 'bitacora-active';
function backup() { try { if (S.active) localStorage.setItem(BK, JSON.stringify(S.active)); } catch (e) {} }

function flushSave() {

  dirty = false;
  S.active._by = CLIENT; S.active._at = Date.now();
  const snap = clone(S.active);
  saving = saving.then(() => S.db.doc('sessions/' + snap.id).set(snap)).catch(e => { dirty = true; writeErr(e); });
  return saving;
}
/* The same session open in two windows (app + browser, two tabs): merge instead of overwriting. */
const doneN = en => (en.sets || []).filter(x => x.done).length;
const doneTot = s => (s.entries || []).reduce((n, en) => n + doneN(en), 0);
function mergeActive(local, remote, preferLocal) {
  const out = clone(preferLocal ? local : remote); const other = preferLocal ? remote : local;
  out.entries = out.entries || [];
  const byId = new Map(out.entries.map(en => [en.exId, en]));
  for (const en of (other.entries || [])) {
    const mine = byId.get(en.exId);
    if (!mine) { out.entries.push(clone(en)); continue; }
    if (doneN(en) > doneN(mine)) Object.assign(mine, clone(en));
  }
  if (!out.notes && other.notes) out.notes = other.notes;
  const oc = out.cardio || (out.cardio = {}), xc = other.cardio || {};
  for (const k of ['min', 'speed', 'incline']) if (num(oc[k]) === null && num(xc[k]) !== null) oc[k] = xc[k];
  out.startedAt = Math.min(local.startedAt || Infinity, remote.startedAt || Infinity);

}
function dropActive(msg) { clearBackup(); S.active = null; S.rest = null; $('#restbar').hidden = true; try { S.wake && S.wake.release(); } catch (e) {} if (msg) toast(msg); render(); }
function syncActive(remote, definitive) {
  const a = S.active; if (!a) return;
  if (!remote) { if (definitive && S.activeSeen === a.id) dropActive('La sesión se descartó en otra ventana.'); return; }
  S.activeSeen = a.id;
  if (remote._by === CLIENT) return;                                   // our own write coming back
  if (remote._at && remote._by === a._by && remote._at <= (a._at || 0)) return; // already up to date
  if (remote.status === 'done') {
    // Finished in another window: keep any set that only this window has.
    const m = mergeActive(a, remote, true);
    m.status = 'done'; m.endedAt = remote.endedAt || Date.now();
    m.entries = m.entries.map(en => ({ ...en, sets: en.sets.filter(x => x.done) })).filter(en => en.sets.length);
    if (doneTot(m) > doneTot(remote)) { m._by = CLIENT; m._at = Date.now(); write('sessions/' + m.id, m); dropActive('Sesión guardada desde otra ventana; se añadieron las series de esta.'); }

  }

}
async function refreshActive() {
  if (!S.active || !S.db) return;

function render() {
  renderTabs();
  const n = new Date();
  $('#topMeta').textContent = n.toLocaleDateString('es-EC', { weekday: 'long', day: 'numeric', month: 'long' });
  const v = $('#view');
  if (S.offline) { v.innerHTML = emptyBlock('No se puede abrir tu bitácora', 'Este navegador no permite guardar datos en el dispositivo (por ejemplo, en modo incógnito). Ábrela en una ventana normal.'); return; }
  if (!S.loaded.routines || !S.loaded.sessions) { v.innerHTML = emptyBlock('Cargando tu bitácora', 'Trayendo tus rutinas y sesiones guardadas.'); return; }
  if (S.dbEmpty) { v.innerHTML = viewWelcome(); return; }
  const ro = S.canWrite === false ? `<div class="banner">Estás viendo esta bitácora en modo lectura. Solo su dueño puede registrar sesiones.</div>` : '';
  let html = '';
  if (S.tab === 'hoy') html = S.active ? viewSession() : viewHoy();
  else if (S.tab === 'prog') html = viewProg();
  else if (S.tab === 'rec') html = viewRec();
  else if (S.tab === 'hist') html = viewHist();
  else if (S.tab === 'rut') html = viewRut();
  // keep horizontal chip rows (exercise list in Progreso, metrics, etc.) where the person left them
  const keep = [...v.querySelectorAll('.chips')].map(c => c.scrollLeft);
  v.innerHTML = ro + html;
  v.querySelectorAll('.chips').forEach((c, i) => {
    if (keep[i]) c.scrollLeft = keep[i];
    const on = c.querySelector('[aria-pressed="true"]'); if (!on) return;
    const l = on.offsetLeft - c.offsetLeft, r = l + on.offsetWidth;

}

function weekStrip() {

function checkSet(ei, si) {
  const a = S.active; const en = a.entries[ei]; const s = en.sets[si];
  if (s.done) { s.done = false; s.pr = false; queueSave(); render(); return; }
  const wi = $('#w-' + ei + '-' + si), ri = $('#r-' + ei + '-' + si);
  let w = num(wi.value); let r = num(ri.value);
  if (r === null) r = num(ri.placeholder);
  if (r === null || r <= 0) { ri.focus(); toast('Anota las repeticiones de esta serie.'); return; }
  if (w === null) w = 0;
  s.w = w; s.r = r; s.done = true;
  if (s.t === 'w') { s.pr = false; queueSave(); startRest(Math.min(60, restFor(en.exId))); render(); return; }
  // Record check
  const hist = history(en.exId, a.id); const b = bests(hist);
  const u = eu(en, a); const wKg = toKg(w, u), e = e1rm(wKg, r);
  const sessionSoFar = en.sets.filter((x, i) => i !== si && x.done && isWork(x)).map(x => ({ w: toKg(num(x.w) || 0, u), r: num(x.r) }));
  const prevBestE = Math.max(b ? b.e1rm.e1rm : 0, ...sessionSoFar.map(x => e1rm(x.w, x.r)), 0);
  const prevBestW = Math.max(b ? b.maxW.maxW : 0, ...sessionSoFar.map(x => x.w), 0);
  const prevBestR = Math.max(b ? b.maxReps.maxReps : 0, ...sessionSoFar.map(x => x.r), 0);
  s.pr = false;
  if (b) {
    if (wKg > 0 && wKg > prevBestW + 0.01) { s.pr = true; toast('Récord de peso en ' + en.name + ': ' + W(wKg, u) + ' ' + u, true); }
    else if (wKg > 0 && e > prevBestE + 0.01) { s.pr = true; toast('Récord de 1RM estimado: ' + W(e, u) + ' ' + u, true); }
    else if (wKg <= 0 && prevBestW <= 0 && r > prevBestR) { s.pr = true; toast('Récord de repeticiones: ' + r, true); }
  }
  queueSave();
  startRest(restFor(en.exId));
  render();
}

/* warm-up sets: ~50/70/85 % of the working weight, rounded to loadable steps */
function workWeight(en) {
  const u = eu(en, S.active);
  const w = en.sets.filter(isWork).map(x => num(x.w)).find(x => x > 0);

/* rest timer */
let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(t => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.18); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2); });
  } catch (e) {}

}
function startRest(secs) {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  const total = (secs || num(S.settings.rest) || 90) * 1000;

}

$('#restPlus').onclick = () => { if (S.rest) { S.rest.end += 15000; S.rest.total += 15000; tick(); } };

function tick() {
  const el = $('#elapsed'); if (el && S.active) el.textContent = clock(Date.now() - S.active.startedAt);
  if (S.rest) {
    const left = S.rest.end - Date.now();
    if (left <= 0 && !S.rest.fired) { S.rest.fired = true; beep(); $('#restTm').textContent = '¡Vamos!'; setTimeout(() => { if (S.rest && S.rest.fired) { S.rest = null; $('#restbar').hidden = true; } }, 4000); }
    if (left > 0) $('#restTm').textContent = clock(left);
    $('#restBarFill').style.width = Math.max(0, Math.min(100, (1 - left / S.rest.total) * 100)) + '%';
  }
}

async function finishSession() {

/* ---------- PROGRESO ---------- */
function niceTicks(min, max, n = 4) {
  if (min === max) { min = min * 0.9; max = max * 1.1 || 1; }
  const span = max - min, raw = span / n, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step; const t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 1000) / 1000);
  return t;
}
function lineChart(pts, unitLbl, color) {
  const Wd = 640, H = 250, L = 46, R = 18, T = 18, B = 30;
  const ys = pts.map(p => p.y); const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = i => pts.length === 1 ? (L + (Wd - R)) / 2 : L + i * (Wd - L - R) / (pts.length - 1);
  const Y = v => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
  const grid = ticks.map(t => `<line x1="${L}" x2="${Wd - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${fmtN(t)}</text>`).join('');
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = pts.length > 1 ? `${line} L ${X(pts.length - 1)} ${H - B} L ${X(0)} ${H - B} Z` : '';
  const every = Math.max(1, Math.ceil(pts.length / 6));
  const xl = pts.map((p, i) => (i % every === 0 || i === pts.length - 1) && !(i !== pts.length - 1 && pts.length - 1 - i < every) ? `<text x="${X(i)}" y="${H - 8}" text-anchor="${pts.length === 1 ? 'middle' : i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${esc(p.label)}</text>` : '').join('');
  const dots = pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i === pts.length - 1 ? 6 : 3.5}" fill="${i === pts.length - 1 ? color : 'var(--surface)'}" stroke="${color}" stroke-width="2"><title>${esc(p.label)}: ${fmtN(p.y)} ${unitLbl}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Evolución en ${unitLbl}">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${area ? `<path d="${area}" fill="url(#ga)"/>` : ''}<path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
}

function muscleBars(map, prevMap, weeks, band) {
  const keys = MUSCLES.concat([...map.keys()].filter(k => !MUSCLES.includes(k)));
  const val = k => (map.get(k) || 0) / weeks; const pv = k => prevMap ? (prevMap.get(k) || 0) / weeks : null;
  const max = Math.max(22, ...keys.map(val)) * 1.05;
  const pct = x => Math.min(100, x / max * 100);
  return `<div class="stack" style="gap:10px">${keys.map(k => {

/* ---------- CUERPO ---------- */

  const list = S.body.slice().sort((a, b) => a.date < b.date ? -1 : 1); const last = list[list.length - 1];
  const ago = last ? Math.round((dateOf(today()) - dateOf(last.date)) / 864e5) : null; const due = !last || ago >= 14;
  const vals = last ? BODY_FIELDS.filter(([k]) => ['weight', 'fat', 'waist', 'arm'].includes(k) && num(last[k]) !== null).map(([k, l]) => l + ' ' + fmtN(bodyVal(last, k)) + ' ' + bodyUnit(k)).join(' · ') : '';
  const when = !last ? 'Aún no registras medidas' : ago === 0 ? 'Registradas hoy' : 'Última vez hace ' + ago + (ago === 1 ? ' día' : ' días');
  return `<div class="card body-card ${due ? 'due' : ''}"><div class="spread"><div class="stack" style="gap:2px;min-width:0"><span class="eyebrow">Medidas corporales</span><span class="small">${when}${due ? ' · toca medirte' : ''}</span>${vals ? `<span class="small muted num">${vals}</span>` : '<span class="small muted">Peso, grasa y perímetros cada 1–2 semanas</span>'}</div><button class="btn sm ${due ? 'primary' : ''}" data-act="gobody">Registrar</button></div></div>`;
}
function bodyVal(e, k) { const v = num(e[k]); if (v === null) return null; return k === 'weight' ? fromKg(v) : v; }
function bodyUnit(k) { const f = BODY_FIELDS.find(x => x[0] === k); return f[2] === 'bw' ? U() : f[2]; }
function viewBody() {
  const list = S.body.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const date = S.bodyDate || today(); const cur = list.find(x => x.date === date) || {};
  const can = S.canWrite !== false;
  const form = can ? `<div class="card"><div class="spread"><h2>Registrar</h2><input type="date" id="b-date" value="${date}" max="${today()}" style="height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:0 8px;color:var(--ink)"></div>
    <div class="grid2">${BODY_FIELDS.map(([k, l]) => { const v = bodyVal(cur, k); return `<label class="field">${l} (${bodyUnit(k)})<input id="b-${k}" data-body="${k}" inputmode="decimal" value="${v === null ? '' : Math.round(v * 10) / 10}"></label>`; }).join('')}</div>
    <p class="small muted" style="margin:0">Llena solo lo que midas. Para comparar bien, mídete a la misma hora, idealmente en ayunas y antes de entrenar.</p>
    <details class="howto small muted"><summary>Cómo medir</summary><p>Cinta métrica flexible, ajustada sin apretar la piel, siempre del mismo lado (derecho).</p><p><b>Cintura:</b> a la altura del ombligo, relajado, al final de una exhalación. <b>Cadera:</b> parte más ancha de los glúteos. <b>Pecho:</b> a la altura de los pezones, brazos relajados. <b>Hombros:</b> contorno en la parte más ancha. <b>Cuello:</b> justo debajo de la nuez.</p><p><b>Brazo:</b> parte más ancha del bíceps, contraído. <b>Antebrazo:</b> parte más ancha, brazo extendido. <b>Muslo:</b> parte más ancha, de pie. <b>Pantorrilla:</b> parte más ancha, de pie.</p></details>
    <button class="btn primary block" data-act="bsave">${cur.date ? 'Actualizar medidas' : 'Guardar medidas'}</button></div>` : '';
  const avail = BODY_FIELDS.filter(([k]) => list.some(e => num(e[k]) !== null));
  if (!avail.length) return form + emptyBlock('Aún no hay medidas', 'Registra tu peso y medidas, por ejemplo una vez por semana, y aquí verás cómo cambian.');
  if (!avail.some(f => f[0] === S.bodyMetric)) S.bodyMetric = avail[0][0];
  const k = S.bodyMetric; const ul = bodyUnit(k);

  const chips = `<div class="chips">${avail.map(([kk, l]) => `<button class="chip" data-act="bmetric" data-m="${kk}" aria-pressed="${kk === k}">${l}</button>`).join('')}</div>`;
  const rows = list.slice(-12).reverse().map(e => `<div class="spread small" style="border-bottom:1px solid var(--line);padding-bottom:6px;align-items:center"><span style="white-space:nowrap"><b>${fmtDate(e.date)}</b></span><span class="num muted" style="text-align:right">${BODY_FIELDS.filter(([kk]) => num(e[kk]) !== null).map(([kk, l]) => (kk === 'weight' ? '' : l.toLowerCase() + ' ') + fmtN(bodyVal(e, kk)) + ' ' + bodyUnit(kk)).join(' · ')}${can ? ` <button class="btn sm ghost danger" data-act="bdel" data-d="${esc(e.date)}" aria-label="Borrar medidas del ${esc(e.date)}">${ICON.x.replace('<svg', '<svg width="14" height="14"')}</button>` : ''}</span></div>`).join('');

function headline(pts, ul) {

/* ---------- RÉCORDS ---------- */
function viewRec() {
  const exs = allExercises();
  const weekAgo = Date.now() - 7 * 864e5;
  const rows = exs.map(ex => {
    const h = history(ex.id); const b = bests(h); const xu = exUnit(ex.id);
    if (!b) return `<div class="rec"><div><h3>${esc(ex.name)}</h3><div class="s">Sin registros todavía</div></div><div class="v muted">—</div></div>`;
    const bw = b.maxW.maxW <= 0;
    const isNew = (bw ? b.maxReps.at : Math.max(b.maxW.at, b.e1rm.at)) > weekAgo && h.length > 1;
    if (bw) return `<div class="rec" style="--plate:${plate(ex.color)}"><div><h3><span class="dot" style="display:inline-block;margin-right:6px"></span>${esc(ex.name)}${isNew ? '<span class="new">Nuevo</span>' : ''}</h3><div class="s">Máx. ${b.maxReps.maxReps} reps en una serie · ${fmtDate(b.maxReps.date)}</div></div><div class="v num">${b.maxReps.maxReps}<span class="s"> reps</span></div></div>`;
    return `<div class="rec" style="--plate:${plate(ex.color)}"><div><h3><span class="dot" style="display:inline-block;margin-right:6px"></span>${esc(ex.name)}${isNew ? '<span class="new">Nuevo</span>' : ''}</h3>
      <div class="s">Peso máx. ${W(b.maxW.maxW, xu)} ${xu} × ${b.maxW.repsAtMax} · ${fmtDate(b.maxW.date)}</div>
      <div class="s">Mejor volumen ${fmtN(fromKg(b.vol.vol, xu), 0)} ${xu} · ${fmtDate(b.vol.date)}</div></div>
      <div><div class="v num">${W(b.e1rm.e1rm, xu)}<span class="s"> ${xu}</span></div><div class="s" style="text-align:right">1RM est.</div></div></div>`;
  }).join('');
  const cs = doneSessions().filter(s => s.kind === 'cardio' && num(s.cardio && s.cardio.min) > 0);
  const longest = cs.reduce((m, s) => !m || num(s.cardio.min) > num(m.cardio.min) ? s : m, null);
  const cardio = longest ? `<div class="rec"><div><h3>Caminadora</h3><div class="s">Sesión más larga · ${fmtDate(longest.date)}</div></div><div class="v num">${fmtN(num(longest.cardio.min))}<span class="s"> min</span></div></div>` : '';

}

/* ---------- HISTORIAL ---------- */
function viewHist() {
  const v = S.histView;
  const seg = `<div class="seg full" role="group" aria-label="Vista de historial">${[['list', 'Sesiones'], ['week', 'Semana'], ['month', 'Mes']].map(([k, l]) => `<button data-act="hview" data-v="${k}" aria-pressed="${v === k}">${l}</button>`).join('')}</div>`;
  return `<div class="spread"><h1>Historial</h1>${exportBtn('sm')}</div>${seg}${v === 'list' ? viewHistList() : viewRecap(v)}`;
}
function aggregate(arr) { return arr.reduce((a, s) => { const t = sessTotals(s); a.n++; a.min += t.min; a.sets += t.n; a.vol += t.vol; a.prs += t.prs; a.cardio += t.cardio; return a; }, { n: 0, min: 0, sets: 0, vol: 0, prs: 0, cardio: 0 }); }
function calendar(from) {
  const first = mondayOf(from); const end = new Date(from.getFullYear(), from.getMonth() + 1, 1); let cells = '';
  const done = doneSessions();
  for (let d = first; d < end || (d.getDay() + 6) % 7 !== 0; d = addDays(d, 1)) {
    const iso = isoOf(d); const inM = d.getMonth() === from.getMonth(); const s = inM ? done.filter(x => x.date === iso).pop() : null;
    cells += `<b class="${inM ? '' : 'out'} ${s ? 'done' : ''} ${iso === today() ? 'today' : ''}" style="--plate:${s ? plate((dayById(s.dayId) || {}).color || s.color) : ''}" ${s ? `title="${esc(s.dayName)}"` : ''} ${inM ? `data-act="calday" data-date="${iso}" role="button" tabindex="0" aria-label="${esc(fmtDate(iso))}${s ? ': ' + esc(s.dayName) : ''}"` : ''}>${inM ? d.getDate() : ''}</b>`;
  }
  return `<div class="cal">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(x => `<span>${x}</span>`).join('')}${cells}</div>`;
}
function viewRecap(kind) {
  const now = new Date(); const off = S.recOff; let from, to, pFrom, label, weeks;
  if (kind === 'week') { from = addDays(mondayOf(now), 7 * off); to = addDays(from, 7); pFrom = addDays(from, -7); label = (off === 0 ? 'Esta semana · ' : '') + weekLabel(from); weeks = 1; }
  else { from = new Date(now.getFullYear(), now.getMonth() + off, 1); to = new Date(from.getFullYear(), from.getMonth() + 1, 1); pFrom = new Date(from.getFullYear(), from.getMonth() - 1, 1); label = from.toLocaleDateString('es-EC', { month: 'long', year: 'numeric' }); weeks = (to - from) / (7 * 864e5); }
  const ss = sessionsIn(from, to), ps = sessionsIn(pFrom, from); const a = aggregate(ss), p = aggregate(ps);
  const st = streaks();
  const k = (v, lbl, d) => `<div><b class="num">${v}</b><span>${lbl}</span>${d !== undefined ? `<em>${d} <span class="muted">vs ${kind === 'week' ? 'sem.' : 'mes'} ant.</span></em>` : ''}</div>`;
  const hm = m => m >= 60 ? Math.floor(m / 60) + ' h ' + pad(Math.round(m % 60)) : Math.round(m) + ' min';
  const kpis = `<div class="kpis">${k(a.n, 'sesiones', deltaTxt(a.n - p.n, ''))}${k(hm(a.min), 'tiempo total', deltaTxt(Math.round(a.min - p.min), 'min'))}${k(a.sets, 'series de trabajo', deltaTxt(a.sets - p.sets, ''))}${k(fmtN(fromKg(a.vol), 0), U() + ' volumen', p.vol ? deltaTxt(Math.round((a.vol - p.vol) / p.vol * 100), '%') : undefined)}${k(a.prs, 'récords')}${k(fmtN(a.cardio), 'min caminadora', deltaTxt(Math.round(a.cardio - p.cardio), 'min'))}</div>`;
  const streak = `<div class="spread"><span class="small">Meta: <b>${st.goal}</b> sesiones por semana</span><span class="row" style="gap:6px">${st.cur ? `<span class="streak">Racha ${st.cur} sem.</span>` : '<span class="small muted">Sin racha activa</span>'}${st.best ? `<span class="small muted">mejor: ${st.best}</span>` : ''}</span></div>`;
  // per-exercise progress inside the period vs everything before it
  const prog = [];
  for (const ex of allExercises()) {
    const h = history(ex.id); const inP = h.filter(x => x.at >= +from && x.at < +to); if (!inP.length) continue;

  const avg = (m, f, t) => { const wk = Math.max(1, (Math.min(+t, +addDays(new Date(now.getFullYear(), now.getMonth(), now.getDate()), 1)) - +f) / (7 * 864e5)); const o = new Map(); for (const [k, v] of m) o.set(k, v / wk); return o; };
  const mus = a.sets ? `<div class="card"><span class="eyebrow">Series por músculo${kind === 'month' ? ' · promedio semanal' : ''}</span>${kind === 'month' ? muscleBars(avg(muscleSets(ss), from, to), avg(muscleSets(ps), pFrom, from), 1, true) : muscleBars(muscleSets(ss), muscleSets(ps), 1, true)}</div>` : '';
  return `<div class="card">${navRow('recnav', off, label)}${kind === 'month' ? calendar(from) : ''}${kpis}${streak}</div>
    ${ss.length ? '' : emptyBlock('Sin sesiones en este periodo', 'Cuando entrenes, aquí verás el resumen con tus series, volumen y récords.')}
    ${sessList ? `<div class="card"><span class="eyebrow">Sesiones · toca para ver el resumen</span>${sessList}</div>` : ''}${progT}${mus}`;

  }).join('')}</div>`;

async function importBackup(j, keep) {

    docs = j && j.docs;

    if (!docs['config/routines']) throw 0;

    if (!st.lastBackup && j.exportedAt) st.lastBackup = isoOf(new Date(j.exportedAt));

/* ---------- GOOGLE DRIVE ----------
   Uses Google Identity Services (token in memory, ~1 h) with the drive.file scope: the app only sees
   the file it created. One file, overwritten on every backup; Drive keeps earlier versions. */
const GOOGLE_CLIENT_ID = '802175350089-ll3k6d0mf8e1tn48rj25a8bri6c05vb7.apps.googleusercontent.com';
const DRIVE_FILE = 'bitacora-gym-respaldo.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
let gis = null, gToken = null, gExp = 0, driveBusy = false;
const driveReady = () => !!GOOGLE_CLIENT_ID;
const driveOn = () => driveReady() && !!S.settings.drive;
const tokenValid = () => gToken && Date.now() < gExp - 60000;
function loadGis() {
  if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if (!gis) gis = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.onload = res; sc.onerror = () => { gis = null; rej(new Error('gis')); }; document.head.appendChild(sc); });
  return gis;
}
/* must start inside a tap: Google opens a small window to confirm the account */
function driveToken(first) {
  if (tokenValid()) return Promise.resolve(gToken);
  return new Promise((res, rej) => {
    if (!(window.google && google.accounts && google.accounts.oauth2)) { loadGis().catch(() => {}); rej(new Error('gis')); return; }
    const tc = google.accounts.oauth2.initTokenClient({ client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE,
      callback: r => { if (r && r.access_token) { gToken = r.access_token; gExp = Date.now() + (r.expires_in || 3600) * 1000; res(gToken); } else rej(new Error(r && r.error || 'denied')); },
      error_callback: er => rej(new Error(er && er.type || 'popup')) });
    tc.requestAccessToken({ prompt: first ? 'consent' : '' });
  });
}
async function gfetch(url, opt = {}) {
  const r = await fetch(url, { ...opt, headers: { ...(opt.headers || {}), Authorization: 'Bearer ' + gToken } });
  if (r.status === 401) { gToken = null; throw new Error('auth'); }
  return r;
}
async function driveUpload() {
  await flushSave();
  S.settings.lastBackup = today();
  const drive = { ...(S.settings.drive || {}) }; S.settings.drive = drive;
  await write('config/settings', { ...S.settings });
  const body = await backupText();
  const meta = { name: DRIVE_FILE, mimeType: 'application/json', description: 'Respaldo de Bitácora de Gym. Impórtalo desde Rutinas › Respaldo › Restaurar desde Drive.' };
  const send = (id) => {
    const fd = new FormData();
    fd.append('metadata', new Blob([JSON.stringify(id ? { description: meta.description } : meta)], { type: 'application/json' }));
    fd.append('file', new Blob([body], { type: 'application/json' }));
    return gfetch('https://www.googleapis.com/upload/drive/v3/files' + (id ? '/' + id : '') + '?uploadType=multipart&fields=id,modifiedTime', { method: id ? 'PATCH' : 'POST', body: fd });
  };
  let r = drive.fileId ? await send(drive.fileId) : null;
  if (!r || r.status === 404) r = await send(null);
  if (!r.ok) throw new Error('upload ' + r.status);
  const f = await r.json();
  S.settings.drive = { fileId: f.id, last: new Date().toISOString() };
  await write('config/settings', { ...S.settings });
}

    for (const [k] of BODY_FIELDS) { const v = num($('#b-' + k).value); if (v !== null && v > 0) { doc[k] = k === 'weight' ? Math.round(toKg(v, U()) * 100) / 100 : v; any = true; } }
    if (!any) { toast('Anota al menos una medida.'); return; }
    if (await write('body/' + date, doc)) { S.body = S.body.filter(x => x.date !== date).concat([doc]); S.bodyDate = null; toast('Medidas guardadas'); render(); }
  }
  else if (act === 'bdel') {
    const ok = await confirmBox({ title: 'Borrar medidas', body: 'Se borrarán las medidas del ' + fmtDate(b.dataset.d, { weekday: 'long', day: 'numeric', month: 'long' }) + '.' }, 'Borrar', true);
    if (ok) { try { await S.db.doc('body/' + b.dataset.d).delete(); S.body = S.body.filter(x => x.date !== b.dataset.d); render(); } catch (er) { writeErr(er); } }
  }
  else if (act === 'goal') { S.settings.weekGoal = +b.dataset.n; render(); write('config/settings', { ...S.settings }); }
  else if (act === 'dbar') { S.settings.bar = { ...(S.settings.bar || {}), [b.dataset.u]: +b.dataset.b }; render(); write('config/settings', { ...S.settings }); }
  else if (act === 'ptog') {
    const u = b.dataset.u, pl = +b.dataset.p; let cur = platesFor(u);
    cur = cur.includes(pl) ? cur.filter(x => x !== pl) : cur.concat([pl]);
    if (!cur.length) { toast('Deja al menos un disco.'); return; }
    S.settings.plates = { ...(S.settings.plates || {}), [u]: cur.sort((x, y) => y - x) }; render(); write('config/settings', { ...S.settings });
  }
  else if (act === 'unit') { S.settings.unit = b.dataset.u; render(); write('config/settings', { ...S.settings }); }
  else if (act === 'rest') { S.settings.rest = +b.dataset.s; render(); write('config/settings', { ...S.settings }); }
  else if (act === 'edit') { S.editDay = b.dataset.day; S.editDraft = clone(dayById(S.editDay)); render(); window.scrollTo(0, 0); }
  else if (act === 'edcancel') { S.editDay = null; S.editDraft = null; render(); }
  else if (act === 'mv') { const i = +b.dataset.i, j = i + +b.dataset.d, x = S.editDraft.exercises; if (j >= 0 && j < x.length) { [x[i], x[j]] = [x[j], x[i]]; render(); } }
  else if (act === 'rmex') { S.editDraft.exercises.splice(+b.dataset.i, 1); render(); }
  else if (act === 'addex') openCatalog(r => {
    const d = S.editDraft; if (d.exercises.some(x => x.id === r.def.id)) { toast(r.def.name + ' ya está en este día.'); return; }
    d.exercises.push(clone(r.def)); closeModal(); render(); toast('Agregado: ' + r.def.name);
  }, { title: 'Agregar a ' + (S.editDraft.name || 'este día'), custom: () => { closeModal(); S.editDraft.exercises.push({ id: '', name: '', unit: U(), group: '', sets: 3, repMin: 8, repMax: 12 }); render(); const i = S.editDraft.exercises.length - 1; const el = $('#ed-n-' + i); el && el.focus(); } });
  else if (act === 'eximg') openExImg(b.dataset.ex);
  else if (act === 'deloadon') { S.settings.deloadUntil = isoOf(addDays(new Date(), 6)); S.settings.lastDeload = today(); write('config/settings', { ...S.settings }); render(); toast('Semana de descarga activada'); }
  else if (act === 'deloadoff') { delete S.settings.deloadUntil; write('config/settings', { ...S.settings }); render(); toast('Descarga terminada'); }
  else if (act === 'newday') newDay();
  else if (act === 'templates') openTemplates();
  else if (act === 'tpl') useTemplate(+b.dataset.i);
  else if (act === 'scratch') startFromScratch();
  else if (act === 'eddow') { S.editDraft.dow = b.dataset.n === '' ? null : +b.dataset.n; render(); }
  else if (act === 'edcolor') { S.editDraft.color = b.dataset.c; render(); }
  else if (act === 'edkind') { S.editDraft.kind = b.dataset.k; if (b.dataset.k === 'pesas' && !(S.editDraft.exercises || []).length) S.editDraft.exercises = [{ id: '', name: '', unit: U(), group: '', sets: 3, repMin: 8, repMax: 12 }]; render(); }
  else if (act === 'eddel') {
    const d = S.editDraft;
    const ok = await confirmBox({ title: 'Eliminar ' + (d.name || 'día'), body: 'El día sale de tu rutina. Las sesiones que ya registraste, tu progreso y tus récords se conservan.' }, 'Eliminar', true);
    if (!ok) return;
    const nr = clone(S.routines); nr.days = nr.days.filter(x => x.id !== d.id); keepOrphans(nr);
    if (await write('config/routines', nr)) { S.routines = nr; S.editDay = null; S.editDraft = null; render(); toast('Día eliminado'); }
  }
  else if (act === 'edsave') {
    const d = S.editDraft; const isNew = S.editDay === NEW_DAY;
    d.name = (d.name || '').trim();
    if (!d.name) { toast('Ponle un nombre al día.'); $('#ed-name').focus(); return; }
    if (d.kind === 'cardio') delete d.exercises;
    else if (!(d.exercises || []).some(x => x.name.trim())) { toast('Agrega al menos un ejercicio.'); return; }
    if (isNew) { const ids = new Set(days().map(x => x.id)); const id0 = slug(d.name); let id = id0, n = 2; while (ids.has(id)) id = id0 + '-' + n++; d.id = id; }
    if (d.kind === 'cardio') {
      const nr = clone(S.routines || { days: [] }); nr.days = isNew ? nr.days.concat([d]) : nr.days.map(x => x.id === d.id ? d : x); sortDays(nr); keepOrphans(nr);
      if (await write('config/routines', nr)) { S.routines = nr; S.editDay = null; S.editDraft = null; render(); toast(isNew ? 'Día creado' : 'Rutina guardada'); }
      return;
    }
    d.exercises = (d.exercises || []).filter(x => x.name.trim()).map(x => {
      const sets = Math.max(1, Math.round(num(x.sets) || 1)); let a = Math.max(1, Math.round(num(x.repMin) || 1)); let z = Math.max(a, Math.round(num(x.repMax) || a));
      let id = x.id; if (!id) { const ids = new Set(allExercises().map(e => e.id)); const found = allExercises().find(e => e.name.trim().toLowerCase() === x.name.trim().toLowerCase()); id = found ? found.id : slug(x.name); if (!found) { let k = id, n = 2; while (ids.has(k)) k = id + '-' + n++; id = k; } }
      return { ...x, id, name: x.name.trim(), unit: x.unit || U(), sets, repMin: a, repMax: z };
    });
    const nr = clone(S.routines || { days: [] });
    // equipment and rest
    d.exercises = d.exercises.map(x => {
      const y = { ...x }; const r = num(y.rest); if (r) y.rest = r; else delete y.rest; const eq = y.equip || ''; if (!eq) delete y.equip;
      const orig = exInfo(y.id); if (!orig || eq === (orig.equip || '')) return y;
      if (!orig.base && !orig.equip) { if (eq) eachDef(nr, y.id, z => { z.equip = eq; }); return y; }   // first label: keeps its history
      if (!orig.base && !history(y.id).length) { eachDef(nr, y.id, z => { if (eq) z.equip = eq; else delete z.equip; }); return y; }
      const vid = idForEquip(nr, orig.base || y.id, eq); const t = findIn(nr, vid) || {};
      const out = { ...y, id: vid, name: t.name || y.name }; if (t.equip) out.equip = t.equip; else delete out.equip; if (t.base) out.base = t.base; else delete out.base;
      return out;
    });
    nr.days = isNew ? nr.days.concat([d]) : nr.days.map(x => x.id === d.id ? d : x);
    sortDays(nr); keepOrphans(nr);
    // keep muscle mapping consistent for the same exercise used on other days and its variants
    for (const e of d.exercises) {
      const sync = x => { x.group = e.group || ''; if (e.group2) x.group2 = e.group2; else delete x.group2; };
      for (const o of nr.days) if (o.id !== d.id) for (const x of (o.exercises || [])) if (x.id === e.id) sync(x);
      for (const x of (nr.extra || [])) if (x.id === e.id || x.base === (e.base || e.id) || x.id === e.base) sync(x);
    }
    if (await write('config/routines', nr)) { S.routines = nr; S.editDay = null; S.editDraft = null; render(); toast(isNew ? 'Día creado' : 'Rutina guardada'); }
  }
});
$('#modalIn').addEventListener('click', async e => {
  const b = e.target.closest('[data-act="tpl"]'); if (b) useTemplate(+b.dataset.i);
  const d = e.target.closest('#sumDrive'); if (d) { d.disabled = true; d.textContent = 'Respaldando…'; try { await driveToken(false); await driveUpload(); d.outerHTML = '<p class="small" style="margin:0;color:var(--ok)">✓ Respaldo guardado en Google Drive</p>'; } catch (er) { d.disabled = false; d.textContent = 'Respaldar en Google Drive'; toast(er && er.message === 'gis' ? 'Preparando la conexión con Google… vuelve a tocar.' : 'No se pudo respaldar en Drive.'); } }
});
$('#view').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && S.active) { const r = t.closest('.set'); const s = S.active.entries[+r.dataset.ei].sets[+r.dataset.si]; s[t.dataset.f] = num(t.value); queueSave(); }
  else if (t.dataset.c && S.active) { S.active.cardio[t.dataset.c] = num(t.value); queueSave(); }
  else if (t.dataset.notes && S.active) { S.active.notes = t.value; queueSave(); }
  else if (t.dataset.ed && S.editDraft) { const i = +t.closest('.ed-item').dataset.i; S.editDraft.exercises[i][t.dataset.ed] = t.dataset.ed === 'name' ? t.value : t.value; }
  else if (t.dataset.edd && S.editDraft) { S.editDraft[t.dataset.edd] = t.value; }
});
$('#view').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'b-date') { S.bodyDate = t.value || null; render(); return; }
  if (t.dataset.eq !== undefined && S.active) { switchEquip(+t.dataset.eq, t.value); return; }
  if (t.dataset.rpe && S.active) { const r = t.closest('.set'); const s = S.active.entries[+r.dataset.ei].sets[+r.dataset.si]; const v = num(t.value); if (v) s.rpe = v; else delete s.rpe; queueSave(); }
});
document.addEventListener('visibilitychange', () => {
  if (!S.active) return;
  if (document.visibilityState === 'hidden') flushSave();   // only writes if this window has unsaved changes
  else refreshActive();                                      // coming back: catch up with other windows
});

/* ---------- boot ---------- */
async function boot() {
  render();
  const db = window.localDB;
  try { S.dbEmpty = (await db.count()) === 0; } catch (e) { S.offline = true; render(); return; }
  S.db = db;
  // ask the browser not to evict our data under storage pressure
  try { if (navigator.storage && navigator.storage.persist) S.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist()); } catch (e) {}
  const onErr = () => { S.offline = true; render(); };
  setTimeout(() => { if (driveReady() && navigator.onLine) loadGis().catch(() => {}); }, 1500);
  db.doc('config/routines').onSnapshot(s => { S.routines = s.exists ? s.data() : null; S.loaded.routines = true; softRender(); warmImages(); }, onErr);
  db.doc('config/settings').onSnapshot(s => { S.settings = { ...DEF_SETTINGS, ...(s.exists ? s.data() : {}) }; softRender(); }, onErr);
  db.collection('photos').onSnapshot(q => { const m = {}; for (const d of q.docs) m[d.id] = d.data().data; S.photos = m; softRender(); }, onErr);
  db.collection('body').onSnapshot(q => { S.body = q.docs.map(d => ({ ...d.data(), date: d.data().date || d.id })); softRender(); }, onErr);
  db.collection('sessions').orderBy('startedAt', 'desc').limit(1000).onSnapshot(q => {
    S.sessions = q.docs.map(d => ({ id: d.id, ...d.data() }));
    S.loaded.sessions = true;
    if (!S.active) { const a = S.sessions.find(x => x.status === 'active' && !DISCARDED.has(x.id)); if (a) { S.active = fromBackup(clone(a)); S.activeSeen = a.id; if (doneTot(S.active) > doneTot(a)) queueSave(); } }
    else syncActive(S.sessions.find(x => x.id === S.active.id), !(q.metadata && (q.metadata.fromCache || q.metadata.hasPendingWrites)));
    softRender();
  }, onErr);
}
boot();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
